<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Reel 26</title>
<style>
  @font-face { font-family: "Inter Tight"; font-weight: 800; src: url(fonts/inter-tight-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter Tight"; font-weight: 900; src: url(fonts/inter-tight-latin-900-normal.woff2) format("woff2"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url(fonts/instrument-serif-latin-400-italic.woff2) format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2"); }
  html, body { margin: 0; background: #0B0B12; color: #F3EEE3; font-family: "JetBrains Mono", monospace; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; box-sizing: border-box; }
  canvas { width: 100%; max-width: 1280px; aspect-ratio: 16 / 9; height: auto; display: block; }
  button { font: 700 14px "JetBrains Mono", monospace; letter-spacing: .1em; background: #FF5A36; color: #0B0B12; border: 0; padding: 10px 18px; cursor: pointer; }
  body.export button { display: none; }
  body.export { padding: 0; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<button id="play">▶ PLAY REEL</button>
<script>
(() => {
const W = 1920, H = 1080, DUR = 15, BEAT = 0.5;
const main = document.getElementById('c').getContext('2d');
let ctx = main;

const C = { ink: '#0B0B12', cream: '#F3EEE3', coral: '#FF5A36', blue: '#2F5BFF', lime: '#D4FF3A', violet: '#8B5CFF' };
const DISP = '"Inter Tight"', SERIF = '"Instrument Serif"', MONO = '"JetBrains Mono"';

// ---------------------------------------------------------------- math
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const TAU = Math.PI * 2;
const E = {
  outExpo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  inExpo: p => p <= 0 ? 0 : Math.pow(2, 10 * p - 10),
  inOutExpo: p => p <= 0 ? 0 : p >= 1 ? 1 : p < .5 ? Math.pow(2, 20 * p - 10) / 2 : (2 - Math.pow(2, -20 * p + 10)) / 2,
  outCubic: p => 1 - Math.pow(1 - p, 3),
  inCubic: p => p * p * p,
  inOutCubic: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  outBack: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  outElastic: p => p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - .75) * TAU / 3) + 1,
};
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const pulse = (t, k = 8) => Math.exp(-(((t % BEAT) + BEAT) % BEAT) * k);
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

// ---------------------------------------------------------------- drawing helpers
const bg = c => { ctx.fillStyle = c; ctx.fillRect(-60, -60, W + 120, H + 120); };
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); }
function setFont(f, track = 0) { ctx.font = f; ctx.letterSpacing = track + 'px'; }
function layout(str, f, track = 0) {
  ctx.save(); setFont(f, track);
  const xs = []; for (let i = 0; i < str.length; i++) xs.push(ctx.measureText(str.slice(0, i)).width);
  const w = ctx.measureText(str).width - track; ctx.restore();
  return { xs, w };
}
// letters rise out of a mask; optional exit pushes them up out again
function maskWord(str, x, y, f, size, color, t, t0, stag, dur, opt = {}) {
  const { track = 0, align = 'center', exit = null, ease = E.outExpo } = opt;
  const L = layout(str, f, track);
  const x0 = align === 'center' ? x - L.w / 2 : align === 'right' ? x - L.w : x;
  ctx.save();
  ctx.beginPath(); ctx.rect(x0 - size, y - size * 1.02, L.w + size * 2, size * 1.3); ctx.clip();
  setFont(f, track); ctx.fillStyle = color; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  for (let i = 0; i < str.length; i++) {
    const p = ease(P(t, t0 + i * stag, t0 + i * stag + dur));
    let dy = (1 - p) * size * 1.1;
    if (exit) dy -= E.inExpo(P(t, exit[0] + i * exit[1], exit[0] + i * exit[1] + exit[2])) * size * 1.2;
    if (p > 0) ctx.fillText(str[i], x0 + L.xs[i], y + dy);
  }
  ctx.restore();
  return { x0, w: L.w };
}
function typeOn(str, x, y, f, color, t, t0, t1, align = 'left', track = 0) {
  const n = Math.floor(P(t, t0, t1) * str.length);
  if (t < t0) return;
  ctx.save(); setFont(f, track); ctx.fillStyle = color; ctx.textAlign = align;
  const full = ctx.measureText(str).width;
  const x0 = align === 'center' ? x - full / 2 : x;
  ctx.textAlign = 'left';
  const s = str.slice(0, n); ctx.fillText(s, x0, y);
  if (n < str.length || Math.floor(t * 4) % 2 === 0) {
    const cw = ctx.measureText(s).width;
    const m = ctx.measureText('M');
    ctx.fillRect(x0 + cw + 4, y - m.actualBoundingBoxAscent, 0.6 * parseFloat(f.match(/(\d+)px/)[1]), m.actualBoundingBoxAscent + 4);
  }
  ctx.restore();
}
function annot(text, x, y, color, t, t0, lx, ly) {
  const p = E.outExpo(P(t, t0, t0 + .3));
  if (p <= 0) return;
  ctx.save(); ctx.globalAlpha = p; ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2;
  if (lx !== undefined) { ctx.beginPath(); ctx.moveTo(x - 12, y - 8); ctx.lineTo(lerp(x - 12, lx, p), lerp(y - 8, ly, p)); ctx.stroke(); circle(lx, ly, 5 * p); ctx.fill(); }
  setFont(`400 24px ${MONO}`, 1); ctx.textAlign = 'left'; ctx.fillText(text, x, y);
  ctx.restore();
}

// ================================================================ SCENE A · IGNITION (0–2)
function sceneA(t) {
  bg(C.ink);
  const cx = W / 2, cy = H / 2;
  // shockwaves
  for (let i = 0; i < 3; i++) {
    const p = P(t, .5 + i * .07, 1.45 + i * .07);
    if (p > 0 && p < 1) {
      ctx.save(); ctx.globalAlpha = (1 - p) * (1 - p); ctx.strokeStyle = i === 1 ? C.cream : C.coral;
      ctx.lineWidth = lerp(28, 1, E.outCubic(p)); circle(cx, cy, 40 + E.outExpo(p) * (1150 - i * 280)); ctx.stroke(); ctx.restore();
    }
  }
  // radial burst lines
  const r1 = E.outExpo(P(t, .52, 1.05)) * 900, r0 = E.outExpo(P(t, .6, 1.3)) * 900;
  if (t > .5 && r1 - r0 > 1) {
    ctx.save(); ctx.strokeStyle = C.cream; ctx.lineCap = 'round';
    for (let i = 0; i < 32; i++) {
      const a = i / 32 * TAU + .1, k = i % 2 ? .62 : 1; ctx.lineWidth = i % 2 ? 2 : 4;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * (120 + r0 * k), cy + Math.sin(a) * (120 + r0 * k));
      ctx.lineTo(cx + Math.cos(a) * (120 + r1 * k), cy + Math.sin(a) * (120 + r1 * k)); ctx.stroke();
    }
    ctx.restore();
  }
  // wordmark geometry
  const f = `900 230px ${DISP}`;
  const Lw = layout('CLAUDE', f, -6).w, mark = 150, gap = 60, gw = mark + gap + Lw;
  const markX = cx - gw / 2 + mark / 2, wordX = markX + mark / 2 + gap;

  // hero shape: dot -> rounded square -> mark -> expanding circle wipe
  let x = cx, y = cy, s, r, rot = 0, sx = 1, sy = 1;
  if (t < .5) {
    s = 76 * E.outElastic(P(t, .02, .42)); r = s / 2;
    const sq = Math.sin(Math.PI * P(t, .34, .5)); sx = 1 + .25 * sq; sy = 1 - .3 * sq;
  } else {
    const g = E.outBack(P(t, .5, .8)), m = E.inOutExpo(P(t, .9, 1.25));
    s = lerp(lerp(76, 260, g), mark, m);
    r = lerp(s / 2, s * .22, E.outExpo(P(t, .5, .85)));
    rot = E.outExpo(P(t, .5, 1.05)) * Math.PI * .75 + m * Math.PI * .25;
    x = lerp(cx, markX, m);
    // exit: back to circle and blow up into the next scene's background
    const w = P(t, 1.62, 2.0);
    if (w > 0) {
      r = lerp(r, s / 2, E.outExpo(P(t, 1.62, 1.75)));
      const k = E.inExpo(w); s = lerp(s, 4600, k); r = s / 2; x = lerp(x, cx, k);
    }
  }
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sx, sy);
  ctx.fillStyle = C.coral; rrect(-s / 2, -s / 2, s, s, r); ctx.fill();
  if (t > .95 && t < 1.62) { // inner cut detail on the mark
    const p = E.outExpo(P(t, 1.0, 1.35)); ctx.fillStyle = C.ink; circle(0, 0, s * .18 * p); ctx.fill();
  }
  ctx.restore();

  if (t > .9 && t < 1.95) {
    maskWord('CLAUDE', wordX, cy + 82, f, 230, C.cream, t, .98, .045, .55, { track: -6, align: 'left', exit: [1.55, .03, .3] });
    ctx.save(); ctx.globalAlpha = 1 - P(t, 1.55, 1.7);
    typeOn('MOTION DESIGN REEL — MMXXVI', wordX + 6, cy + 160, `400 30px ${MONO}`, C.cream, t, 1.15, 1.5, 'left', 4);
    ctx.restore();
  }
}

// ================================================================ SCENE B · TYPOGRAPHY (2–4)
const pixOff = document.createElement('canvas');
function wordPanel(k, wt, t) {
  const cx = W / 2, cy = H / 2;
  if (k === 0) {
    bg(C.coral);
    const p = E.outExpo(P(wt, 0, .2)), size = 800;
    const sq = Math.exp(-P(wt, .12, 1) * 12) * Math.sin(P(wt, .12, 1) * 40) * .08 * (wt > .12);
    ctx.save(); ctx.translate(cx, cy + size * .36 + lerp(-H * 1.2, 0, p)); ctx.scale(1 - sq, 1 + sq);
    // speed streaks
    if (p < 1) { ctx.fillStyle = C.ink; for (let i = 0; i < 4; i++) ctx.fillRect(-160 + i * 90, -size * .8 - 700 * (1 - p), 10, 600 * (1 - p)); }
    setFont(`900 ${size}px ${DISP}`); ctx.textAlign = 'center'; ctx.fillStyle = C.ink; ctx.fillText('I', 0, 0);
    ctx.restore();
    annot('( first person, singular )', cx + 200, cy - 180, C.ink, wt, .15, cx + 110, cy - 120);
  } else if (k === 1) {
    bg(C.ink);
    maskWord('MAKE', cx, cy + 150, `900 420px ${DISP}`, 420, C.cream, wt, .02, .035, .35, { track: -12 });
    annot('( verb, present tense )', cx + 420, cy - 210, C.coral, wt, .18, cx + 330, cy - 150);
  } else if (k === 2) {
    bg(C.blue);
    // mosaic -> sharp
    const levels = [1 / 48, 1 / 24, 1 / 12, 1 / 6, 1 / 3, 1];
    const q = levels[Math.min(5, Math.floor(P(wt, 0, .3) * 6))];
    const w = Math.ceil(W * q), h = Math.ceil(H * q);
    pixOff.width = w; pixOff.height = h;
    const g = pixOff.getContext('2d');
    g.scale(q, q); g.font = `900 360px ${DISP}`; g.letterSpacing = '-10px'; g.textAlign = 'center'; g.fillStyle = C.lime;
    g.fillText('PIXELS', cx, cy + 130);
    ctx.save(); ctx.imageSmoothingEnabled = false; ctx.drawImage(pixOff, 0, 0, w, h, 0, 0, W, H); ctx.restore();
    annot('( ~2,073,600 per frame )', cx + 330, cy - 200, C.lime, wt, .2, cx + 240, cy - 130);
  } else {
    bg(C.lime);
    const f = `400 560px ${SERIF}`, str = 'dance.';
    const L = layout(str, f, -8);
    ctx.save(); setFont(f, -8); ctx.fillStyle = C.ink; ctx.textAlign = 'left';
    for (let i = 0; i < str.length; i++) {
      const p = E.outBack(P(wt, i * .03, i * .03 + .25));
      const bob = Math.sin(wt * 16 + i * 1.1) * 26 * p, rot = Math.sin(wt * 13 + i * 1.7) * .09 * p;
      ctx.save(); ctx.translate(cx - L.w / 2 + L.xs[i] + 90, cy + 170 + bob); ctx.rotate(rot); ctx.scale(p, p);
      ctx.fillText(str[i], -90, 0); ctx.restore();
    }
    ctx.restore();
    annot('( on the beat )', cx + 380, cy - 230, C.ink, wt, .15, cx + 290, cy - 170);
  }
}
function wipeClip(k, wt) {
  if (k === 1) { const h = E.outExpo(P(wt, 0, .16)) * H; ctx.beginPath(); ctx.rect(0, H - h, W, h); return; }
  if (k === 2) {
    const r = rng(9); ctx.beginPath();
    for (let j = 0; j < 9; j++) for (let i = 0; i < 16; i++) if (wt > r() * .14) ctx.rect(i * 120, j * 120, 121, 121);
    return;
  }
  const p = E.outExpo(P(wt, 0, .2)); circle(W * .72, H * .4, p * 2300);
}
function sceneB(t) {
  const lt = t - 2, k = Math.min(3, Math.floor(lt / BEAT)), wt = lt - k * BEAT;
  if (k > 0 && wt < .22) {
    wordPanel(k - 1, BEAT + wt, t);
    ctx.save(); wipeClip(k, wt); ctx.clip(); wordPanel(k, wt, t); ctx.restore();
  } else wordPanel(k, wt, t);
  // exit: interleaved bars
  if (lt > 1.76) {
    ctx.fillStyle = C.cream;
    for (let i = 0; i < 12; i++) {
      const p = E.outExpo(P(lt, 1.76 + i * .012, 1.96 + i * .012)), h = H / 12;
      if (i % 2) ctx.fillRect(W - p * W, i * h - 1, p * W + 2, h + 2); else ctx.fillRect(0, i * h - 1, p * W, h + 2);
    }
  }
}

// ================================================================ SCENE C · SYSTEMS (4–6)
function drawGrid(lt, pal, accent) {
  const cell = 80, cols = 24, rows = 14;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const x = i * cell + cell / 2, y = j * cell + cell / 2 - 20;
    const d = Math.hypot(x - W / 2, y - H / 2) / 1100;
    const intro = E.outBack(P(lt, d * .45, d * .45 + .35));
    const d2 = (i + j) / (cols + rows), flip = E.inOutCubic(P(lt, 1.0 + d2 * .45, 1.3 + d2 * .45));
    const out = 1 - E.inExpo(P(lt, 1.55 + (1 - d) * .2, 1.85 + (1 - d) * .2));
    const wave = .62 + .38 * Math.sin(lt * 7 - d * 11);
    const s = cell * .36 * intro * wave * out * (1 + pulse(lt + 4, 9) * .18);
    if (s <= .3) continue;
    const type = (i + j * 2 + (flip > .5 ? 1 : 0)) % 3;
    const hot = (i * 7 + j * 13) % 11 === 0;
    ctx.fillStyle = hot ? accent[(i + j) % accent.length] : pal;
    ctx.save(); ctx.translate(x, y); ctx.rotate(flip * Math.PI / 2 + (type === 2 ? Math.PI / 4 * wave : 0));
    if (type === 0) { circle(0, 0, s); ctx.fill(); }
    else if (type === 1) { rrect(-s, -s, s * 2, s * 2, s * .3); ctx.fill(); }
    else { const k = s * .42; ctx.fillRect(-s, -k, s * 2, k * 2); ctx.fillRect(-k, -s, k * 2, s * 2); }
    ctx.restore();
  }
}
function sceneC(t) {
  const lt = t - 4;
  bg(C.cream);
  const fx = W / 2 + Math.sin(lt * 2.1) * 420, fy = H / 2 + Math.sin(lt * 3.3 + 1) * 180;
  let fr = E.outBack(P(lt, .45, .85)) * 290 + pulse(t, 10) * 24;
  const fx2 = lerp(fx, W / 2, E.inOutCubic(P(lt, 1.5, 1.8))), fy2 = lerp(fy, H / 2, E.inOutCubic(P(lt, 1.5, 1.8)));
  fr = lerp(fr, 2400, E.inExpo(P(lt, 1.66, 2.0)));
  drawGrid(lt, C.ink, [C.coral, C.blue]);
  ctx.save(); circle(fx2, fy2, fr); ctx.clip(); bg(C.ink); drawGrid(lt, C.cream, [C.lime, C.coral]); ctx.restore();
  if (fr > 1 && fr < 1500) { ctx.save(); ctx.strokeStyle = C.coral; ctx.lineWidth = 3; circle(fx2, fy2, fr + 14); ctx.setLineDash([6, 12]); ctx.lineDashOffset = -lt * 60; ctx.stroke(); ctx.restore(); }
}

// ================================================================ SCENE D · DIMENSION (6–8)
const N = 1600, SPH = [], TOR = [], RND = [];
{
  const r = rng(3);
  for (let i = 0; i < N; i++) {
    const y = 1 - 2 * (i + .5) / N, rr = Math.sqrt(1 - y * y), th = i * 2.399963;
    SPH.push([Math.cos(th) * rr, y, Math.sin(th) * rr]);
    const u = (i % 64) / 64 * TAU, v = Math.floor(i / 64) / 25 * TAU;
    TOR.push([(1 + .42 * Math.cos(v)) * Math.cos(u) * .82, .42 * Math.sin(v) * .82, (1 + .42 * Math.cos(v)) * Math.sin(u) * .82]);
    const a = r() * TAU, b = Math.acos(2 * r() - 1), d = 4 + r() * 4;
    RND.push([Math.sin(b) * Math.cos(a) * d, Math.cos(b) * d, Math.sin(b) * Math.sin(a) * d]);
  }
}
const cBlue = hex(C.blue), cViolet = hex(C.violet), cCoral = hex(C.coral), cLime = hex(C.lime);
function sceneD(t) {
  const lt = t - 6;
  bg(C.ink);
  // outline type behind
  ctx.save(); setFont(`900 520px ${DISP}`, -10); ctx.textAlign = 'center'; ctx.strokeStyle = 'rgba(243,238,227,.14)'; ctx.lineWidth = 2;
  ctx.strokeText('DEPTH', W / 2 + 120 - lt * 120, H / 2 + 190); ctx.restore();

  const m = E.inOutCubic(P(lt, .9, 1.4)), out = E.inExpo(P(lt, 1.55, 2.0));
  const ry = lt * 1.2 + E.inOutCubic(P(lt, .9, 1.4)) * Math.PI, rx = .45 + Math.sin(lt * 1.4) * .3 + m * .5;
  const R = 360 * (1 + .1 * pulse(t, 9)), camZ = lerp(1300, 120, out), fov = 950;
  const cyy = Math.cos(ry), syy = Math.sin(ry), cxx = Math.cos(rx), sxx = Math.sin(rx);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < N; i++) {
    const k = (i % 97) / 97, pi = E.outExpo(P(lt, k * .35, k * .35 + .6));
    const a = SPH[i], b = TOR[i], c = RND[i];
    const disp = 1 + .07 * pulse(t, 7) * Math.sin(i * 12.9898 + lt * 20);
    let x = lerp(c[0], lerp(a[0], b[0], m) * disp, pi), y = lerp(c[1], lerp(a[1], b[1], m) * disp, pi), z = lerp(c[2], lerp(a[2], b[2], m) * disp, pi);
    let x2 = x * cyy - z * syy, z2 = x * syy + z * cyy;
    let y2 = y * cxx - z2 * sxx; z2 = y * sxx + z2 * cxx;
    const zz = z2 * R + camZ;
    if (zz < 30) continue;
    const sc = fov / zz, px = W / 2 + x2 * R * sc, py = H / 2 + y2 * R * sc;
    const depth = clamp((z2 + 1) / 2), h = clamp((y + 1) / 2);
    const col = h < .5 ? cBlue.map((v, j) => lerp(v, cViolet[j], h * 2)) : cViolet.map((v, j) => lerp(v, cCoral[j], h * 2 - 1));
    ctx.fillStyle = `rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},${lerp(1, .35, depth)})`;
    const sz = Math.max(.8, 3.4 * sc * (i % 23 === 0 ? 2.2 : 1));
    circle(px, py, sz); ctx.fill();
  }
  ctx.restore();
  // nerdy readouts
  ctx.save(); setFont(`400 22px ${MONO}`, 2); ctx.fillStyle = 'rgba(243,238,227,.7)'; ctx.textAlign = 'left';
  const a = E.outExpo(P(lt, .2, .6)); ctx.globalAlpha = a * (1 - out);
  ctx.fillText(`POINTS   ${N}`, 120, H - 250);
  ctx.fillText(`ROT.Y    ${(ry % TAU).toFixed(3)} rad`, 120, H - 218);
  ctx.fillText(`MORPH    ${(m * 100).toFixed(1).padStart(5, ' ')} %  SPHERE → TORUS`, 120, H - 186);
  ctx.fillStyle = C.lime; ctx.fillRect(120, H - 170, 360 * m, 3); ctx.fillStyle = 'rgba(243,238,227,.2)'; ctx.fillRect(120 + 360 * m, H - 170, 360 * (1 - m), 3);
  ctx.restore();
}

// ================================================================ SCENE E · FLUIDITY (8–10)
function blobPath(cx, cy, base, lt, amp) {
  ctx.beginPath();
  for (let i = 0; i <= 120; i++) {
    const a = i / 120 * TAU;
    const r = base * (1 + amp * (.12 * Math.sin(3 * a + lt * 3) + .08 * Math.sin(5 * a - lt * 4.2) + .05 * Math.sin(8 * a + lt * 6))
      + .07 * pulse(lt + 8, 8) * Math.sin(6 * a));
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * .92;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}
function sceneE(t) {
  const lt = t - 8;
  bg(C.blue);
  // ribbons
  const A = 150 * E.outExpo(P(lt, 0, .7));
  ctx.save(); ctx.lineWidth = 2;
  for (let i = 0; i < 30; i++) {
    const end = W * E.outExpo(P(lt, i * .012, i * .012 + .6)) + 60;

  // resolve
  impact(13.0, 1); kick(13.0, 1); whoosh(12.95, .2, .4);
  pad(13.0, [48, 55, 60, 64, 67, 71].map(hz), 1.6, .05);
  [60, 64, 67, 71, 72, 76].forEach((n, i) => pluck(13.1 + i * .125, hz(n + 12), .09, (i - 2.5) * .25, 'triangle', .5));
  kick(14.0, .6); pluck(14.0, hz(84), .1, 0, 'sine', 1.2); pluck(14.0, hz(91), .05, 0, 'sine', 1.2);
  pluck(14.9, hz(93), .04, 0, 'sine', .6);

  return ac.startRendering();
}

// ================================================================ boot
window.ready = Promise.all([
  `900 100px ${DISP}`, `800 100px ${DISP}`, `italic 400 100px ${SERIF}`, `400 20px ${MONO}`, `700 20px ${MONO}`
].map(f => document.fonts.load(f))).then(() => document.fonts.ready);
window.renderFrame = render;
window.renderAudioBase64 = async () => {
  const buf = await renderAudio(), L = buf.getChannelData(0), R = buf.getChannelData(1);
  const n = Math.round(DUR * 48000), pcm = new Int16Array(n * 2);
  for (let i = 0; i < n; i++) { pcm[i * 2] = clamp(L[i], -1, 1) * 32767; pcm[i * 2 + 1] = clamp(R[i], -1, 1) * 32767; }
  const u8 = new Uint8Array(pcm.buffer); let s = '';
  for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode(...u8.subarray(i, i + 8192));
  return btoa(s);
};

if (new URLSearchParams(location.search).has('export')) document.body.classList.add('export');
window.ready.then(() => render(13.95));

// live preview
let playing = false, audioBuf = null;
document.getElementById('play').onclick = async () => {
  if (playing) return; playing = true;
  const ac = new AudioContext();
  audioBuf = audioBuf || await renderAudio();
  const src = ac.createBufferSource(); src.buffer = audioBuf; src.connect(ac.destination);
  const t0 = ac.currentTime + .05; src.start(t0);
  const tick = () => {
    const t = ac.currentTime - t0;
    render(clamp(t, 0, DUR - 1e-3));
    if (t < DUR) requestAnimationFrame(tick); else playing = false;
  };
  requestAnimationFrame(tick);
};
})();
</script>
